apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: oc-pipelines-oc-final-run-
spec:
  pipelineRef:
    name: oc-pipelines-oc-final
  params:
    - name: repo-url
      value: https://github.com/HonestMoth/ci-cd-final-project.git
    - name: branch
      value: main
    - name: build-image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-vinaymagar84/ci-cd-final-project:latest
  workspaces:
    - name: output
      persistentVolumeClaim:
        claimName: oc-lab-pvc
